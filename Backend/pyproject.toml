[project]
name = "stockpilot-backend"
version = "0.1.0"
description = "Real-time stock prediction system with XGBoost, FastAPI, WebSockets"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Your Name", email = "your.email@example.com"}
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "yfinance>=0.2.0",
    "ta>=0.9.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "python-dotenv>=1.0.0",
    "jupyterlab>=4.0.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "fastapi>=0.103.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "pytest>=7.4.0",
    "structlog>=23.0.0",
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "psycopg2-binary>=2.9.12",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.3.0",
    "transformers>=5.14.0",
    "torch>=2.13.0",
    "pymupdf>=1.28.0",
    "pdfplumber>=0.11.10",
    "openpyxl>=3.1.5",
    "vectorbt>=0.26.2",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ✅ ADD THIS SECTION - Tells hatchling where your source code is
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
